name: mazha-home-dev

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mazha_home}
      POSTGRES_USER: ${POSTGRES_USER:-mazha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 4s
      retries: 12

  app:
    image: mazha0309blog:dev
    build:
      context: .
      target: dependencies
    command:
      - sh
      - -c
      - npm run db:migrate && npm run db:seed && npm run dev
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:${DEV_PORT:-5173}
      PORT: 5173
      TZ: ${TZ:-Asia/Shanghai}
      MEDIA_ROOT: /data/media
      DATABASE_URL: postgresql://${POSTGRES_USER:-mazha}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-mazha_home}
      BETTER_AUTH_SECRET: local-development-secret-change-me-0309
      ALLOWED_GITHUB_ID: "99137842"
      DEV_ADMIN_BYPASS: ${DEV_ADMIN_BYPASS:-true}
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - media_dev_data:/data/media
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 4s
      start_period: 30s
      retries: 4

volumes:
  postgres_dev_data:
  media_dev_data:
  node_modules:

networks:
  internal:
