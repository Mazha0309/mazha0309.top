name: mazha-home

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    memswap_limit: ${POSTGRES_MEMORY_SWAP_LIMIT:-384m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-64m}
    pids_limit: 128
    shm_size: 64m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      - -c
      - autovacuum_max_workers=1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mazha_home}
      POSTGRES_USER: ${POSTGRES_USER:-mazha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 4s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${APP_IMAGE:-mazha0309blog:local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    memswap_limit: ${APP_MEMORY_SWAP_LIMIT:-768m}
    mem_reservation: ${APP_MEMORY_RESERVATION:-128m}
    pids_limit: 128
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Shanghai}
      MEDIA_ROOT: /data/media
      DATABASE_URL: postgresql://${POSTGRES_USER:-mazha}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mazha_home}
      NODE_OPTIONS: ${APP_NODE_OPTIONS:---max-old-space-size=256}
      MALLOC_ARENA_MAX: "2"
    volumes:
      - media_data:/data/media
    networks:
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 4s
      start_period: 25s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
  media_data:

networks:
  internal:
    internal: true
  edge:
