name: CMS Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "37 18 * * *"

concurrency:
  group: cms-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Run backup on VPS
        id: remote
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp scripts/backup.sh "$USER@$HOST:$DEPLOY_PATH/scripts/backup.sh"
          remote_path="$(ssh "$USER@$HOST" "cd '$DEPLOY_PATH' && chmod +x scripts/backup.sh && BACKUP_OUTPUT_DIR=backups scripts/backup.sh" | tail -n 1)"
          scp "$USER@$HOST:$DEPLOY_PATH/$remote_path" ./cms-backup.tar.gz
      - name: Publish private release assets
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: Mazha0309/mazha0309-top-backups
        run: |
          daily_tag="daily-$(date -u +%F)"
          gh release delete "$daily_tag" --repo "$BACKUP_REPO" --yes >/dev/null 2>&1 || true
          gh release create "$daily_tag" cms-backup.tar.gz \
            --repo "$BACKUP_REPO" \
            --title "CMS backup $(date -u +%F)" \
            --notes "Automated unencrypted CMS/media backup. Auth and analytics are excluded."

          if [[ "$(date -u +%u)" == "7" ]]; then
            weekly_tag="weekly-$(date -u +%G-W%V)"
            gh release delete "$weekly_tag" --repo "$BACKUP_REPO" --yes >/dev/null 2>&1 || true
            gh release create "$weekly_tag" cms-backup.tar.gz \
              --repo "$BACKUP_REPO" \
              --title "Weekly CMS backup $(date -u +%G-W%V)" \
              --notes "Weekly retention copy."
          fi

          mapfile -t old_daily < <(gh release list --repo "$BACKUP_REPO" --limit 100 --json tagName --jq '.[].tagName | select(startswith("daily-"))' | sort -r | tail -n +15)
          for tag in "${old_daily[@]}"; do gh release delete "$tag" --repo "$BACKUP_REPO" --yes --cleanup-tag; done

          mapfile -t old_weekly < <(gh release list --repo "$BACKUP_REPO" --limit 100 --json tagName --jq '.[].tagName | select(startswith("weekly-"))' | sort -r | tail -n +9)
          for tag in "${old_weekly[@]}"; do gh release delete "$tag" --repo "$BACKUP_REPO" --yes --cleanup-tag; done
